name: PR E2E MVP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-mvp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreOffice + archive tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice zip p7zip-full

      - name: Install LibreOffice + archive tools (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install LibreOffice + archive tools (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-still zip 7zip -y
        shell: pwsh

      - name: Setup Python deps for office fixtures
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Build kkFileView
        run: mvn -q -pl server -DskipTests package

      - name: Install E2E deps
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start fixture server (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd tests/e2e/fixtures
          python3 -m http.server 18080 > /tmp/fixture-server.log 2>&1 &

      - name: Start fixture server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','18080' -WorkingDirectory tests/e2e/fixtures -RedirectStandardOutput "$env:TEMP\fixture-server.log" -RedirectStandardError "$env:TEMP\fixture-server-err.log"

      - name: Start kkFileView (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR_PATH=$(ls server/target/kkFileView-*.jar | head -n 1)
          nohup env KK_TRUST_HOST='*' KK_NOT_TRUST_HOST='10.*,172.16.*,192.168.*' java -jar "$JAR_PATH" > /tmp/kkfileview.log 2>&1 &

      - name: Start kkFileView (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem server/target/kkFileView-*.jar | Select-Object -First 1 -ExpandProperty FullName
          $env:KK_TRUST_HOST = '*'
          $env:KK_NOT_TRUST_HOST = '10.*,172.16.*,192.168.*'
          Start-Process java -ArgumentList '-jar',$jar -RedirectStandardOutput "$env:TEMP\kkfileview.log" -RedirectStandardError "$env:TEMP\kkfileview-err.log"

      - name: Wait for services
        shell: bash
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/sample.txt >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8012/ >/dev/null && break
            sleep 1
          done

      - name: Run E2E
        working-directory: tests/e2e
        env:
          KK_BASE_URL: http://127.0.0.1:8012
          FIXTURE_BASE_URL: http://127.0.0.1:18080
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs-${{ matrix.os }}
          path: |
            /tmp/kkfileview.log
            /tmp/fixture-server.log
            ${{ runner.temp }}\kkfileview.log
            ${{ runner.temp }}\kkfileview-err.log
            ${{ runner.temp }}\fixture-server.log
            ${{ runner.temp }}\fixture-server-err.log
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
