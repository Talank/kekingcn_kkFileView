name: Nightly E2E Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-nightly:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreOffice + archive tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice zip p7zip-full

      - name: Install LibreOffice + archive tools (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install LibreOffice + archive tools (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice -y

      - name: Setup Python deps for office fixtures
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Build kkFileView
        run: mvn -q -pl server -DskipTests package

      - name: Install E2E deps
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start fixture server (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: tests/e2e/fixtures
        run: python3 -m http.server 18080 > /tmp/fixture-server.log 2>&1 &

      - name: Start fixture server (Windows)
        if: runner.os == 'Windows'
        working-directory: tests/e2e/fixtures
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','18080' -RedirectStandardOutput "$env:TEMP\fixture-server.log" -RedirectStandardError "$env:TEMP\fixture-server-err.log" -WindowStyle Hidden

      - name: Start kkFileView (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          JAR_PATH=$(ls server/target/kkFileView-*.jar | head -n 1)
          nohup env KK_TRUST_HOST='*' KK_NOT_TRUST_HOST='10.*,172.16.*,192.168.*' java -jar "$JAR_PATH" > /tmp/kkfileview.log 2>&1 &

      - name: Start kkFileView (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem server/target/kkFileView-*.jar | Select-Object -First 1 -ExpandProperty FullName
          $env:KK_TRUST_HOST = '*'
          $env:KK_NOT_TRUST_HOST = '10.*,172.16.*,192.168.*'
          Start-Process java -ArgumentList '-jar',$jar -RedirectStandardOutput "$env:TEMP\kkfileview.log" -RedirectStandardError "$env:TEMP\kkfileview-err.log" -WindowStyle Hidden

      - name: Wait for services (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          fixture_ready=false
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/sample.txt >/dev/null; then
              fixture_ready=true
              break
            fi
            sleep 1
          done
          if [ "$fixture_ready" != "true" ]; then
            echo "Error: fixture server did not become ready within 60 seconds." >&2
            exit 1
          fi

          kkfileview_ready=false
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8012/ >/dev/null; then
              kkfileview_ready=true
              break
            fi
            sleep 1
          done
          if [ "$kkfileview_ready" != "true" ]; then
            echo "Error: kkFileView service did not become ready within 120 seconds." >&2
            exit 1
          fi

      - name: Wait for services (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixtureReady = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:18080/sample.txt -UseBasicParsing -ErrorAction Stop | Out-Null; $fixtureReady = $true; break } catch {}
            Start-Sleep 1
          }
          if (-not $fixtureReady) { Write-Error "fixture server did not become ready within 60 seconds."; exit 1 }

          $kkReady = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8012/ -UseBasicParsing -ErrorAction Stop | Out-Null; $kkReady = $true; break } catch {}
            Start-Sleep 1
          }
          if (-not $kkReady) { Write-Error "kkFileView service did not become ready within 120 seconds."; exit 1 }

      - name: Run nightly E2E suites
        working-directory: tests/e2e
        env:
          KK_BASE_URL: http://127.0.0.1:8012
          FIXTURE_BASE_URL: http://127.0.0.1:18080
          E2E_MAX_PREVIEW_MS: 20000
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: tests/e2e/playwright-report

      - name: Upload service logs (Linux/macOS)
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-service-logs
          path: |
            /tmp/kkfileview.log
            /tmp/fixture-server.log

      - name: Upload service logs (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-service-logs
          path: |
            ${{ runner.temp }}\kkfileview.log
            ${{ runner.temp }}\kkfileview-err.log
            ${{ runner.temp }}\fixture-server.log
            ${{ runner.temp }}\fixture-server-err.log

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
